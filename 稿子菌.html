    ${tl.length?`<div class="tl-list">${tlH}</div>`:'<div style="font-size:11px;color:var(--t3)">暂无记录</div>'}</div>
    </div><div class="mf">${!isN?'<button class="bdel" id="fDl">🗑 删除</button>':'<div></div>'}<div style="display:flex;gap:6px"><button class="bcan" id="fCa">取消</button><button class="bsav rev" id="fSv">${isN?'添加':'保存'}</button></div></div></div>`;
    ov.onclick=e=>{if(e.target===ov){editing=null;rmF();render()}};
    document.getElementById('fX').onclick=document.getElementById('fCa').onclick=()=>{editing=null;rmF();render()};
    document.getElementById('evA').onclick=()=>{const l=document.getElementById('evL').value.trim();if(!l)return;const evDt=document.getElementById('evD').value;if(evDt&&!vD(evDt)){toast('时间线日期格式无效（年份须为4位）','error');return}if(!r.timeline)r.timeline=[];r.timeline.push({id:uid(),date:evDt,label:l,color:'#059669',note:document.getElementById('evN').value.trim()});syncR();rf()};
    document.querySelectorAll('.del-ev').forEach(b=>{b.onclick=()=>{r.timeline=r.timeline.filter(ev=>ev.id!==b.dataset.evid);syncR();rf()}});
    document.getElementById('fSv').onclick=()=>{syncR();if(!r.journal.trim()){toast('请输入期刊名称','error');return};const ivd=document.getElementById('rvI')?.value;if(ivd&&!vD(ivd)){toast('邀请日期格式无效（年份须为4位）','error');return}const dvd=document.getElementById('rvD')?.value;if(dvd&&!vD(dvd)){toast('截止日期格式无效（年份须为4位）','error');return};r.status=r.decision?'completed':'pending';r.id=r.id||uid();if(isN)reviews.push(r);else{const idx=reviews.findIndex(x=>x.id===r.id);if(idx>=0)reviews[idx]=r};editing=null;rmF();persist()};
    const dl=document.getElementById('fDl');if(dl)dl.onclick=()=>{if(confirm('确认删除？')){reviews=reviews.filter(x=>x.id!==r.id);editing=null;rmF();persist()}};
    function syncR(){r.journal=document.getElementById('rvJ')?.value||'';r.paperTitle=document.getElementById('rvT')?.value||'';r.inviteDate=document.getElementById('rvI')?.value||'';r.dueDate=document.getElementById('rvD')?.value||'';r.round=parseInt(document.getElementById('rvR')?.value||'1');r.decision=document.getElementById('rvDec')?.value||'';r.link=document.getElementById('rvL')?.value||'';r.notes=document.getElementById('rvN')?.value||'';const accUser=document.getElementById('rvAccUser');const accPass=document.getElementById('rvAccPass');if(accUser&&accPass){if(!r.account)r.account={};r.account.username=accUser.value;r.account.password=accPass.value}}
  }
  rf();setTimeout(()=>document.getElementById('rvJ')?.focus(),80);
}
function toggleFormPwd(inputId){const input=document.getElementById(inputId);const btn=input.nextElementSibling;if(input.type==='password'){input.type='text';btn.textContent='🙈'}else{input.type='password';btn.textContent='👁️'}}
function rmF(){const m=document.getElementById('f-ov');if(m)m.remove()}

/* ========== Tab切换 ========== */
function switchMainTab(tab){
  mainTab=tab;search='';view='list';groupBy=(tab==='reviews')?'status':'status';
  filterYear='';filterMonth='';filterJournal='';
  detailId=null;editing=null;selectMode=false;selectedIds.clear();
  if(tab!=='progress')_progressPaperId='';
  render();
}
function switchTab(){}

/* ========== 事件绑定 ========== */
function bindEvents(){
  document.querySelectorAll('.tab[data-t]').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.t;
      if(t==='papers'){mainTab='papers';search='';view='list';groupBy='status';clearFilters();exitSelectMode()}
      else if(t==='reviews'){mainTab='reviews';search='';view='list';groupBy='status';clearFilters();exitSelectMode()}
      else if(t==='progress'){mainTab='progress';view='list'}
      else if(t==='dashboard'){mainTab='dashboard';view='dashboard'}
      else{mainTab=t;view='list'}
      filterYear='';filterMonth='';filterJournal='';detailId=null;editing=null;selectMode=false;selectedIds.clear();
      render();
    }
  });
  document.querySelectorAll('.tab[data-v]').forEach(b=>{
    b.onclick=()=>{view=b.dataset.v;render()}
  });
  
  const xNew=document.getElementById('xNew');
  if(xNew)xNew.onclick=()=>{editing='new';showForm()};
  
  const searchInput=document.getElementById('xSch');
  if(searchInput){
    searchInput.oninput=e=>{if(searchTimeout)clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>{search=e.target.value;render()},300)};
  }
  document.querySelectorAll('.gtog button').forEach(b=>{b.onclick=()=>{groupBy=b.dataset.g;render()}});
  
  if(mainTab==='papers'){
    document.querySelectorAll('.pc[data-eid]').forEach(c=>{
      c.onclick=e=>{if(e.target.closest('.qb')||e.target.closest('.clk')||e.target.closest('.star')||e.target.closest('.hist-link')||e.target.closest('.cact-btn')||e.target.closest('.pc-select'))return;editing=papers.find(p=>p.id===c.dataset.eid);if(editing)showForm()}
    });
    document.querySelectorAll('.qb').forEach(b=>{
      b.onclick=e=>{e.stopPropagation();const p=papers.find(x=>x.id===b.dataset.id);if(p){p.status=b.dataset.st;if(!p.timeline)p.timeline=[];p.timeline.push({id:uid(),date:td(),label:gs(b.dataset.st).label,color:gs(b.dataset.st).color,note:''});persist()}}
    });
    document.querySelectorAll('.star').forEach(s=>{
      s.onclick=e=>{e.stopPropagation();const p=papers.find(x=>x.id===s.dataset.id);if(p){p.priority=parseInt(s.dataset.pr);persist()}}
    });
    document.querySelectorAll('.hist-link').forEach(l=>{
      l.onclick=e=>{e.stopPropagation();const id=l.dataset.goid;if(id){detailId=id;render()}}
    });
  }else if(mainTab==='reviews'){
    document.querySelectorAll('.pc[data-rid]').forEach(c=>{
      c.onclick=e=>{if(e.target.closest('.cact-btn')||e.target.closest('.clk')||e.target.closest('.pc-select')||e.target.closest('.hist-link'))return;editing=reviews.find(r=>r.id===c.dataset.rid);if(editing)showForm()}
    });
  }
  
  const bke=document.getElementById('bkExport');if(bke)bke.onclick=doExport;
  const bkd=document.getElementById('bkDismiss');if(bkd)bkd.onclick=()=>{dismissBackup();render()};
}

function updateFilter(type,value){
  if(type==='year'){filterYear=value;filterMonth=''}else if(type==='month')filterMonth=value;else if(type==='journal')filterJournal=value;
  render();
}
function clearFilters(){filterYear='';filterMonth='';filterJournal='';render()}

/* ========== 初始化 ========== */
initRepo().then(()=>{initFileStore();loadAll().then(()=>{render();if(repo.bound&&repo.handle){setTimeout(()=>{if(confirm('是否让仓库数据覆盖现有HTML存的数据？'))fullSyncFromRepo()},800)}})});
</script>
</body>
</html>
